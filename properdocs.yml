site_name: SignalK CLI
site_url: https://signalk-cli.rhizomatics.org.uk
site_description: Command line access to SignalK APIs and streaming data

repo_name: rhizomatics/signalk-cli
repo_url: https://github.com/rhizomatics/signalk-cli
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Python library:
      - library.md
      - History API: api/history.md
      - Streaming API: api/stream.md
      - Tables, errors and discovery: api/common.md
  - What's New: changelog.md
  - Coverage: developer/coverage.md

theme:
  name: materialx
  highlightjs: true
  logo: /assets/images/logo-256.png
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.code.annotate 
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - toc.integrate
    - search.suggest
    - search
    - search.share

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhizomatics

plugins:
  - search
  - autorefs
  - pagetree
  - optimize
  - termynal:
    include_assets: true
    prompt_literal_start:
      - '$'
      - '>>>'
  - mkdocs-homepage-copier:
      extras:
        - src: CHANGELOG.md
          dest: docs/changelog.md
          copy: true
  - tags:
      tags: false
  - meta-descriptions
  - minify:
      minify_html: true
  - coverage:
      page_path: developer/coverage
      html_report_dir: htmlcov
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            docstring_section_style: list
  # after mkdocstrings/autorefs, so it sees the final cross-reference links
  - htmlproofer:
      skip_downloads: True
      # mkdocstrings cross-references are valid, but htmlproofer mis-resolves
      # their relative paths from directory URLs
      ignore_urls:
        - "*#signalk_cli.*"
  - llmstxt:
      markdown_description: >-
        Python CLI to query the SignalK v2 History API and v1 Streaming API,
        exporting to CSV, JSON, JSON Lines or Apache Arrow Feather.
        Installed as `signalk-cli`, run as `signalk_cli.history` and `signalk_cli.stream`.
      full_output: llms-full.txt
      sections:
        Usage:
          - index.md: Installation, host discovery, commands, options and examples
        Python library:
          - library.md: Using signalk-cli from Python — history and streaming clients, tables, errors
          - api/history.md: HistoryClient, HistoryResult, TimeRange reference
          - api/stream.md: StreamClient, DeltaStream, DeltaMessage, DeltaRow reference
          - api/common.md: ArrowTable, SignalKError, discover_host reference
        Release notes:
          - changelog.md: Changes in each release

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - smarty
  - toc:
      permalink: true
  - sane_lists
  - pymdownx.snippets:
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn 

not_in_nav: |
  de/
  es/
  fr/
  hi/
  it/
  ja/
  nl/
  pl/
  pt/
  zh-Hans/
