[project]
name = "signalk-cli"
version = "2.2.1"
description = "Query SignalK v2 APIs and export data as CSV, JSON or Apache Arrow Feather"
readme = "README.md"
requires-python = ">=3.13"
license="Apache-2.0"
authors = [
    { name = "jey burrows", email = "jrb@rhizomatics.org.uk" }
]

keywords = ["signalk", "sailing", "marine", "nmea","boating"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
    "click>=8.3.3",
    "nanoarrow>=0.9.0,<1.0.0",
    "niquests[ws]>=2.28",
    # Pyodide/WASM: niquests needs >=3.21 there, and zeroconf can't run (no raw sockets)
    "niquests[ws]>=3.21.0; sys_platform == 'emscripten'",
    "zeroconf>=0.149.16,<0.152.0; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
# pyarrow, only needed to write Feather files from the CLI
feather = ["pyarrow>=17.0"]
# alias of feather
arrow = ["pyarrow>=17.0"]
[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pre-commit>=4.4.0",
    "pytest>=9.0.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist",
    "mypy",
    "coverage",
    "genbadge[all]",
    "icdiff",
    "codespell"
]

docs=[
    "properdocs",
    "mkdocs-materialx[imaging]",
    "mkdocs-minify-plugin",
    "mkdocs-autorefs",
    "mkdocs-pagetree-plugin",
    "mkdocs-coverage",
    "pymdown-extensions",
    "mkdocs-meta-descriptions-plugin",
    "pngquant",
    "mkdocs-htmlproofer-plugin",
    "mkdocs-llmstxt>=0.5.0,<0.6.0",
    "mkdocstrings[python]>=1.0.6,<2.0.0",
]

[project.urls]
Homepage = "https://signalk-cli.rhizomatics.org.uk"
Repository = "https://github.com/rhizomatics/signalk-cli"
Issues="https://github.com/rhizomatics/signalk-cli/issues"
Changelog="https://github.com/rhizomatics/signalk-cli/blob/main/CHANGELOG.md"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = [
    "tests",
]
norecursedirs = [
    ".git"
]


[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under=90

[tool.coverage.xml]
output="cov.xml"

[tool.coverage.html]
directory="htmlcov"

[tool.codespell]
skip = ".venv,.git,htmlcov,site,./.*,*.csv,*.json,README.*.md,support"
count = true
quiet-level = 2
ignore-words-list="hass,referer,uint"

[tool.mypy]
mypy_path=["./src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "nanoarrow.*"]
ignore_missing_imports = true

[tool.ty.analysis]
# optional `feather` extra
allowed-unresolved-imports = ["pyarrow", "pyarrow.**"]

[tool.uv]
compile-bytecode = true
managed = true
exclude-newer = "7 days"
exclude-newer-package = {"uv_build"="2 days"}
add-bounds = "major"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-root = "src"
module-name = "signalk_cli"

[project.scripts]
"signalk_cli.history" = "signalk_cli.history.cli:cli"
"signalk_cli.stream" = "signalk_cli.stream.cli:cli"
