# Releases signalk-cli when a version tag (v3.0.3, v3.1.0-beta1) is pushed - see policies/release_workflows.md in
# rhizomatics/hq. CI runs on the tag, the wheel and sdist are built and attested, the GitHub release is published
# with the CHANGELOG.md notes and those files attached, and then the same files go to PyPI, or to TestPyPI for a
# pre-release. PyPI's trusted publisher names this workflow and the `pypi`/`testpypi` environments, so this file
# keeps its name.
name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    tags: ["v*"]

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

env:
  # use uv-managed Python, not the runner's older system one (eMudhra fix needs >=3.13.17, >=3.14.9, >=3.15.1)
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build distribution 📦
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # for the build provenance attestation
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: 3.14
        # nothing cached is used to build what's released
        enable-cache: false
    - name: Build a binary wheel and a source tarball
      run: uv build --out-dir release
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: release/*
    - name: Keep the files for the release
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release
        path: release/

  github-release:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      artifact: release

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    # Only full releases (not pre-releases)
    if: needs.github-release.outputs.prerelease == 'false'
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signalk-cli
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download the released files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    # Pre-releases
    if: needs.github-release.outputs.prerelease == 'true'
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/signalk-cli
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download the released files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
